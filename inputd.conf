# /etc/inputd.conf
#
# Remap an evdev button code to a logical button:
#   button <evdev-code> <NAME>
# NAME is one of:
#   A B X Y L1 R1 L2 R2 SELECT START L3 R3 F VOLUP VOLDN UP DOWN LEFT RIGHT
# Codes may be decimal or 0x hex.
#
# To find the code a physical button really sends, stop the service and run:
#   doas rc-service inputd stop
#   doas inputd -d
# then press the button. Example output:
#   [gamepad] type=1 code=305 value=1
#
# Example: physical "A" reports 305 and should act as logical A
#   button 305 A
#
# Log every raw event (same as -d):
#   debug

# Pinning devices instead of auto-detecting is done with daemon arguments,
# not this file. Put them in /etc/conf.d/inputd:
#   INPUTD_ARGS="--gamepad /dev/input/event3 --power /dev/input/event0"
